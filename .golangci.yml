version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Cobra flag registration — never fails with valid flag names during init
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - (*github.com/spf13/pflag.FlagSet).MarkDeprecated
        # Viper flag binding — never fails with valid flag names during init
        - github.com/spf13/viper.BindPFlag
        # Shell completion generation — writing to stdout, non-critical
        - (*github.com/spf13/cobra.Command).GenBashCompletion
        - (*github.com/spf13/cobra.Command).GenZshCompletion
        - (*github.com/spf13/cobra.Command).GenFishCompletion
        - (*github.com/spf13/cobra.Command).GenPowerShellCompletionWithDesc
    forbidigo:
      # Human-facing output goes through util.Out/util.Err.
      analyze-types: true
      forbid:
        - pattern: '^fmt\.(Print|Fprint)(f|ln)?$'
          pkg: '^fmt$'
          msg: use util.Printf/Println/Print so server-controlled text is sanitized
        - pattern: '^os\.(Stdout|Stderr)$'
          pkg: '^os$'
          msg: use util.Out/util.Err instead of the raw stream
        - pattern: '^(print|println)$'
          msg: use util.Print/Println so server-controlled text is sanitized
        - pattern: '^log\.((Print|Fatal|Panic)(f|ln)?|Default)$'
          pkg: '^log$'
          msg: the default logger writes raw to stderr; use util.Eprintf or log.New(util.Err, ...)
        - pattern: '^pterm\.(Print|Fprint|Info|Warning|Error|Success|Debug|Fatal)'
          msg: pterm writes raw to stdout; use util.Print*
        - pattern: '^pterm\.DefaultTable$'
          msg: use util.RenderTable so cells are sanitized and the table goes to util.Out
        - pattern: '^cobra\.CheckErr$'
          msg: CheckErr writes raw to os.Stderr; use util.Eprintln with Sanitize
    gocritic:
      disabled-checks:
        - captLocal
        - commentFormatting
    misspell:
      locale: US
  exclusions:
    rules:
      # Tests: unchecked errors are fine, and they capture the raw streams.
      - path: _test\.go
        linters:
          - errcheck
          - forbidigo
          - gosec
      # sanitize.go is where Out/Err and the Print* wrappers are defined.
      - path: internal/util/sanitize\.go
        linters:
          - forbidigo
      # pterm Render() — table output to stdout, non-critical
      - text: "Render"
        linters:
          - errcheck
      # client.Logout — cleanup call, error is non-actionable
      - text: "Logout"
        linters:
          - errcheck
      # file.Close() in defer — standard Go pattern, error is non-actionable
      - text: "file.Close"
        linters:
          - errcheck
      # G402: intentional InsecureSkipVerify for user-configured TLS skip
      - text: "G402:"
        linters:
          - gosec
      # G104: gosec flags same "unhandled errors" as errcheck for Cobra/Viper/pterm patterns
      # These are init-time registrations that never fail with valid flag names
      - text: "G104:"
        linters:
          - gosec
      # G304: CLI reads files from user-provided paths — intentional behavior
      - text: "G304:"
        linters:
          - gosec
      # G204: CLI launches user-specified subcommands — intentional behavior
      - text: "G204:"
        linters:
          - gosec
      # G117: marshaling password fields to send to Passbolt API — legitimate
      - text: "G117:"
        linters:
          - gosec
      # G115: integer conversions for worker count, fd, and period — safe for expected values
      - text: "G115:"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
